name: Build and push image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/altitudecode/mission-control:latest
            ghcr.io/altitudecode/mission-control:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # NOTE: GHCR packages default to private. After the first push you must
      # manually set visibility to "Public" in GitHub → Package Settings, since
      # the GITHUB_TOKEN cannot change package visibility. This is required for
      # unauthenticated pulls (e.g. from an EC2 instance without docker login).

      - name: Trigger infra deploy
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          repository: altitudecode/mission-control-infra
          event-type: image-updated
          client-payload: '{"sha": "${{ github.sha }}"}'
