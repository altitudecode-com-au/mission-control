name: Docker Build Validation

# Validate the Docker image builds successfully on PRs (no push).
# The actual push happens in docker-publish.yml after quality-gate passes on main.

on:
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mission-control:pr-${{ github.event.number }}
          cache-from: type=gha,scope=docker-main
          cache-to: type=gha,mode=max,scope=docker-pr
